name: Portfolio quality checks

on:
  push:
    branches:
      - main
      - "design/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate portfolio files and links
        run: python scripts/validate_portfolio.py
      - name: Check whitespace errors
        run: git diff --check
