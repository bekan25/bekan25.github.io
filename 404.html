<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071326">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://bekan25.github.io/">
<title>Page not found | Dereje Solomon</title>
<style>
:root{color-scheme:dark;--ink:#f3f7ff;--muted:#a9bad3;--cyan:#67e8f9;--blue:#4778ff;--violet:#9b7cff}
*{box-sizing:border-box}
html{min-height:100%;background:#071326}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:28px;background:radial-gradient(ellipse at 15% 15%,rgba(36,112,190,.28),transparent 42%),radial-gradient(ellipse at 85% 80%,rgba(111,70,210,.22),transparent 44%),linear-gradient(135deg,#061020 0%,#0b1b35 52%,#10152f 100%);color:var(--ink);font:16px/1.7 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body:before,body:after{content:"";position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.24;pointer-events:none}
body:before{top:-160px;left:-100px;background:#19b8e6}
body:after{right:-140px;bottom:-170px;background:#7755ff}
main{position:relative;width:min(100%,620px);padding:clamp(34px,7vw,64px);text-align:center;border:1px solid rgba(177,211,255,.2);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.045));box-shadow:0 30px 100px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.12);backdrop-filter:blur(26px) saturate(145%);-webkit-backdrop-filter:blur(26px) saturate(145%)}
.eyebrow{display:inline-flex;align-items:center;gap:9px;margin:0 0 18px;padding:7px 12px;border:1px solid rgba(103,232,249,.24);border-radius:999px;background:rgba(20,184,220,.09);color:#9deafa;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:#5eead4;box-shadow:0 0 14px #5eead4}
strong{display:block;font-size:clamp(88px,19vw,150px);font-weight:850;letter-spacing:-.09em;line-height:.95;background:linear-gradient(115deg,#fff 8%,#9deafa 48%,#9b8cff 92%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 14px 60px rgba(65,133,255,.12)}
h1{margin:24px 0 10px;font-size:clamp(25px,5vw,38px);line-height:1.15;letter-spacing:-.045em}
p{max-width:430px;margin:0 auto 30px;color:var(--muted);font-size:15px}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 22px;border:1px solid rgba(255,255,255,.16);border-radius:14px;color:var(--ink);text-decoration:none;font-weight:750;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
a.primary{border-color:rgba(123,197,255,.38);background:linear-gradient(110deg,#176fe5,#6656e9);box-shadow:0 12px 30px rgba(48,105,235,.28)}
a.secondary{background:rgba(255,255,255,.055);backdrop-filter:blur(12px)}
a:hover{transform:translateY(-2px);border-color:rgba(150,220,255,.6);box-shadow:0 14px 32px rgba(0,0,0,.2)}
a:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
@supports not ((backdrop-filter:blur(2px))){main{background:#122744}}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Dereje Solomon · Portfolio</p>
  <strong>404</strong>
  <h1>This page wandered off.</h1>
  <p>The link may be outdated or the page may have moved. Your portfolio is still here—return to the homepage and continue exploring.</p>
  <div class="actions">
    <a class="primary" href="https://bekan25.github.io/">Return to portfolio <span aria-hidden="true">&nbsp;↗</span></a>
    <a class="secondary" href="https://github.com/bekan25">Visit GitHub</a>
  </div>
</main>
</body>
</html>
