<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://bekan25.github.io/">
<title>Page not found | Dereje Solomon</title>
<style>
:root{color-scheme:light;--ink:#172b27;--muted:#53665e;--green:#087653;--gold:#d9bd70}
*{box-sizing:border-box}
html{min-height:100%;background:#f7f8f5}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,rgba(8,118,83,.10),transparent 42%),radial-gradient(ellipse at 85% 80%,rgba(217,189,112,.12),transparent 44%),linear-gradient(135deg,#f7f8f5,#edf4ee 55%,#f4fbf6);color:var(--ink);font:16px/1.7 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{position:relative;width:min(100%,620px);padding:clamp(32px,7vw,64px);text-align:center;border:1px solid rgba(3,47,39,.14);border-radius:30px;background:rgba(255,255,255,.82);box-shadow:0 24px 70px rgba(3,47,39,.10);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}
.eyebrow{display:inline-flex;align-items:center;gap:9px;margin:0 0 18px;padding:7px 12px;border:1px solid rgba(8,118,83,.18);border-radius:999px;background:rgba(8,118,83,.07);color:#07523c;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
strong{display:block;font-size:clamp(88px,19vw,150px);font-weight:850;letter-spacing:-.09em;line-height:.95;background:linear-gradient(115deg,#087653,#d9bd70);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin:24px 0 10px;font-size:clamp(25px,5vw,38px);line-height:1.15;letter-spacing:-.045em}
p{max-width:430px;margin:0 auto 30px;color:var(--muted);font-size:15px}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 22px;border:1px solid rgba(91,116,158,.2);border-radius:14px;color:var(--ink);text-decoration:none;font-weight:750;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
a.primary{border-color:transparent;background:linear-gradient(110deg,#087653,#d9bd70);color:white;box-shadow:0 12px 30px rgba(82,111,232,.22)}
a.secondary{background:rgba(255,255,255,.7)}
a:hover{transform:translateY(-2px);border-color:rgba(8,118,83,.5);box-shadow:0 12px 28px rgba(35,58,99,.10)}
a:focus-visible{outline:3px solid #087653;outline-offset:4px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
@supports not ((backdrop-filter:blur(2px))){main{background:#fff}}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Dereje Solomon · Portfolio</p>
  <strong>404</strong>
  <h1>This page wandered off.</h1>
  <p>The link may be outdated or the page may have moved. Your portfolio is still here—return to the homepage and continue exploring.</p>
  <div class="actions">
    <a class="primary" href="https://bekan25.github.io/">Return to portfolio <span aria-hidden="true">&nbsp;↗</span></a>
    <a class="secondary" href="https://github.com/bekan25">Visit GitHub</a>
  </div>
</main>
</body>
</html>
